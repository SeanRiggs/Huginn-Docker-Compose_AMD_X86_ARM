# Fresh installations only. Existing users: read UPGRADING.md before starting.
services:
  huginn:
    image: ${HUGINN_IMAGE:-ghcr.io/huginn/huginn:v2026.10.24}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${HUGINN_BIND_ADDRESS:-127.0.0.1}:${HUGINN_PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      DATABASE_ADAPTER: mysql2
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${MYSQL_DATABASE:-huginn_production}
      DATABASE_USERNAME: ${MYSQL_USER:-huginn}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/setup.py first}
      DATABASE_ENCODING: utf8mb4
      START_MYSQL: "false"
      APP_SECRET_TOKEN: ${APP_SECRET_TOKEN:?Run python3 scripts/setup.py first}
      DOMAIN: ${DOMAIN:-localhost:3000}
      FORCE_SSL: ${FORCE_SSL:-false}
      TIMEZONE: ${TIMEZONE:-UTC}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_EMAIL: ${SEED_EMAIL:-admin@example.invalid}
      SEED_PASSWORD: ${SEED_PASSWORD:?Run python3 scripts/setup.py first}
      INVITATION_CODE: ${INVITATION_CODE:?Run python3 scripts/setup.py first}
      SKIP_INVITATION_CODE: "false"
      ENABLE_SMOKESCREEN: ${ENABLE_SMOKESCREEN:-false}
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/users/sign_in')).code == '200' ? 0 : 1)"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 40
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 scripts/setup.py first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-huginn_production}
      MYSQL_USER: ${MYSQL_USER:-huginn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 scripts/setup.py first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
